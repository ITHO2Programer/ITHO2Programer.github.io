      <h2>การสร้าง QR</h2>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<div  id="qrcode" ></div>
      <div style="padding-top: 20px;"> </div>
<input id="text" placeholder="ใส่ข้อความหรือ URL">
<button onclick="generate()">สร้าง QR</button>


<div style="padding-top: 20px;"> </div>
 <h4> โปรแกรมสร้าง QR Code ต่างๆ </h4>     
<table>
  <tr>
    <th>ลำดับ</th>

  </tr>

    <td>w3schools</td>

     <td> <a href='https://www.canva.com/qr-code-generator/' target="_blank" >https://www.canva.com/qr-code-generator/</a> </td>

  <tr>

     <td> <a href='https://www.qrcode-monkey.com/' target="_blank" >https://www.qrcode-monkey.com/</a> </td>
  </tr>
</table>




      

<script>
function generate() {
  document.getElementById("qrcode").innerHTML = ""; // เคลียร์ของเก่า
  new QRCode(document.getElementById("qrcode"), {
    text: document.getElementById("text").value,
    width: 200,
    height: 200
  });
}
</script>
